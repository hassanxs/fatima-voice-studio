# Test build: llama-server with pull request #26603, which adds POST /tts (Qwen3-TTS kept loaded between requests,
# instead of llama-tts loading it for every part). By default it builds the PR's own commit (it doesn't merge cleanly
# into b11476, the voice engine's release), with llama-tts from the same tree for a like-for-like comparison.
# CUDA 13.4 for RTX 50 cards only (sm_120), to keep the build short; it loads cuBLAS/cudart from the voice
# engine's folder. Run it by hand; the zip stays a workflow artifact (nothing is published).
name: llama-server TTS test build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "llama.cpp commit or release to build"
        required: true
        default: "435d4116eda2abbcdc3d63d85204470070f32705"
      pr:
        description: "Pull request to merge on top, as number@commit (empty: none)"
        required: false
        default: ""
      cuda_arch:
        description: "CMAKE_CUDA_ARCHITECTURES"
        required: true
        default: "120a-real"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - name: Get llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.pr != '' && '0' || '1' }}

      - name: Merge the pull request
        if: inputs.pr != ''
        shell: pwsh
        run: |
          $num, $sha = "${{ inputs.pr }}".Split("@")
          git fetch --no-tags origin "pull/$num/head"
          if ($LASTEXITCODE) { throw "Couldn't fetch PR #$num" }
          git -c user.name=build -c user.email=build@localhost merge --no-edit $sha
          if ($LASTEXITCODE) { git diff --name-only --diff-filter=U; throw "PR #$num doesn't merge cleanly" }
          git log --oneline -3

      # The same CUDA components and versions as llama.cpp's Windows builds of the voice engine (b11476).
      - name: Install CUDA 13.4
        shell: pwsh
        run: |
          $root = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4"
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $parts = @(
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.4.59-archive.zip",
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.4.49-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.4.59-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.4.59-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-13.7.0.27-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.4.59-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.4.49-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.4.49-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-13.4.49-archive.zip",
            "cccl/windows-x86_64/cccl-windows-x86_64-13.3.4.2.1-archive.zip")
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($p in $parts) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $p -Leaf)
            curl.exe -sSfL -o $zip "$base/$p"
            7z x $zip -o"$env:RUNNER_TEMP\cuda" -y | Out-Null
          }
          Get-ChildItem "$env:RUNNER_TEMP\cuda" -Directory | ForEach-Object {
            robocopy $_.FullName $root /E /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Copying $($_.Name) failed (robocopy $LASTEXITCODE)" }  # 1-7 mean copied
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V13_4=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Build
        shell: cmd
        run: |
          choco install ninja -y --no-progress
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.cuda_arch }}
          if errorlevel 1 exit /b 1
          set /A JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %JOBS% --target llama-server llama-tts

      - name: Pack
        shell: pwsh
        run: |
          $out = "pack"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem build\bin -Include *.exe, *.dll -Recurse | Copy-Item -Destination $out
          Copy-Item LICENSE "$out\LICENSE.txt"
          "llama.cpp ${{ inputs.ref }} with PR ${{ inputs.pr }} merged; CUDA 13.4, arch ${{ inputs.cuda_arch }}." | Out-File "$out\NOTICE.txt" -Encoding utf8
          Get-ChildItem $out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table | Out-String | Write-Host
          if (-not (Test-Path "$out\llama-server.exe")) { throw "llama-server.exe wasn't built" }
          Compress-Archive -Path "$out\*" -DestinationPath "llama-tts-server-win-cuda-13.4-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: llama-tts-server-cuda
          path: llama-tts-server-*.zip
